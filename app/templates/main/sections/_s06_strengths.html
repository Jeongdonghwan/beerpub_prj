{# 성공포인트 — Easy / Taste / Profit (레드 스트립) #}
<section class="fp s6" id="s6">
  <div class="wrap">
    <h2 data-rv>{{ brand.success_points.headline | safe }}</h2>
    <div class="sp-grid">
      {% for p in brand.success_points['items'] %}
      <div class="sp" data-rv="blur" style="transition-delay:{{ loop.index0 * 0.12 }}s">
        <b class="disp en">{{ p.en }}</b>
        <h4>{{ p.title }}</h4>
        <p>{{ p.desc }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
