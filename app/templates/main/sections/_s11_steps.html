{# 개설절차 — 라이트 배경, 8단계 원형 카드 지그재그 한 화면 표시 #}
<section class="fp s11" id="s11">
  <div class="wrap">
    <p class="kicker" data-rv>상담부터 오픈까지, 빠르고 투명하게</p>
    <h2 class="disp" data-rv style="transition-delay:.08s">성공창업의 <span class="r">빠른 길</span>로 이끌어 드립니다.</h2>

    <div class="steps-grid">
      {% for s in brand.startup_steps %}
      <div class="step {{ 'down' if loop.index0 % 2 }}" data-rv="zoom" style="transition-delay:{{ 0.12 + loop.index0 * 0.07 }}s">
        <div class="circle">
          <b class="badge disp">STEP<span>{{ '%02d' | format(loop.index) }}</span></b>
          <h4>{{ s.name }}</h4>
          <p>{{ s.desc }}</p>
        </div>
      </div>
      {% endfor %}
    </div>
    <div class="steps-line" data-rv style="transition-delay:.7s"><i></i></div>
  </div>
</section>
