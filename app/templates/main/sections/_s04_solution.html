{# 해결 — 23년의 외식 경험. 배경 실사 + 센터 카피 + pill 뱃지 + 누끼 음식 3종 #}
<section class="fp s4" id="s4">
  <div class="s4-bg"><img src="{{ brand.section_images.solution_bg }}" alt="" aria-hidden="true"></div>
  <div class="s4-dim"></div>
  <div class="wrap s4-in">
    <h2 data-rv>{{ brand.contrast_frame.solution_headline | safe }}</h2>
    <div class="pills" data-rv style="transition-delay:.1s">
      {% for p in brand.success_points['items'] %}<span>{{ p.title }}</span>{% endfor %}
    </div>
    <div class="dishes">
      {% for d in brand.solution_dishes %}
      <span class="dish" data-rv="zoom" style="transition-delay:{{ 0.15 + loop.index0 * 0.12 }}s"><img class="float" src="{{ d }}" alt="{{ brand.name }} 대표 메뉴" loading="lazy"></span>
      {% endfor %}
    </div>
  </div>
</section>
