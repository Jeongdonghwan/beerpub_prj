{% from "_macros.html" import ph with context %}
<section class="fp s1" id="s1">
  <div class="vwrap">
    {% if brand.hero_youtube_id %}
    <iframe class="hero-video"
      src="https://www.youtube.com/embed/{{ brand.hero_youtube_id }}?autoplay=1&mute=1&controls=0&loop=1&playlist={{ brand.hero_youtube_id }}&playsinline=1"
      title="{{ brand.name }} 브랜드 영상" frameborder="0" allow="autoplay" tabindex="-1"></iframe>
    {% else %}
    <div class="hero-fallback kenburns">
      {{ ph(brand.hero_fallback_image, '히어로 영상', '1920x1080', tone='dark', cls='hero-ph') }}
    </div>
    {% endif %}
    <div class="hero-dim"></div>
  </div>
  <div class="wrap hero-copy">
    <p class="h-main disp" data-rv>{{ brand.slogan }}</p>
    <p class="h-sub" data-rv style="transition-delay:.15s">{{ brand.sub_slogan }}</p>
  </div>
  <a class="scroll-down" href="#s2" aria-label="아래로 스크롤"><i></i></a>
</section>
