<section class="fp s2" id="s2"{% if site_config.get('s2_bg_image') %} style="background-image:url('{{ site_config.get('s2_bg_image') }}')"{% endif %}>
  <div class="wrap grid">
    <div class="neon-title">
      <div class="hand" data-rv>다시 찾는 이유가 있는 브랜드</div>
      <h2 data-rv>{{ brand.name }}</h2>
      <div class="line" data-rv></div>
      <div class="why" data-rv>{{ brand.revisit.sub }}</div>
    </div>
    <div>
      <h3 class="rv-head disp" data-rv>{{ brand.revisit.headline | safe }}</h3>
      {% with rv_tone='neon', rv_reveal='rv' %}{% include "partials/_revisit_grid.html" %}{% endwith %}
      <p class="closing disp" data-rv>{{ brand.revisit.closing | safe }}</p>
    </div>
  </div>
</section>
