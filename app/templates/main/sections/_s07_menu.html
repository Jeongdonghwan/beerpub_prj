{% from "_macros.html" import ph with context %}
{# 메뉴 — 매장 실사 딤 배경 + 센터 카피 + 누끼 메뉴 마퀴 (리얼펍 레퍼런스) #}
<section class="fp s7" id="s7">
  <div class="s7-bg"><img src="{{ brand.section_images.menu_bg }}" alt="" aria-hidden="true"></div>
  <div class="s7-dim"></div>
  <div class="s7-in">
    <h2 data-rv>{{ brand.menu_headline | safe }}</h2>
    <p class="s7-sub" data-rv style="transition-delay:.08s">가격 보고 한 번, 맛 보고 또 한 번 놀라실 겁니다</p>
    <a class="btn-red pill-btn" href="{{ url_for('menu.preview') }}" data-rv style="transition-delay:.16s">메뉴전체보기</a>
    <div class="mq" data-rv style="transition-delay:.24s">
      <div class="mq-track" style="--dur:56s"><div class="set">
        {% for m in menus %}
        <div class="mmi" data-modal-url="{{ url_for('menu.popup', menu_id=m.id) }}">
          {{ ph(m.image, '메뉴 사진', '800x800', alt=brand.name ~ ' ' ~ m.name) }}
          <span class="disp">{{ m.name }}</span>
        </div>
        {% endfor %}
      </div></div>
    </div>
  </div>
</section>
