{# 하단 고정 바 — 카카오톡 상담 / 무료시식 신청 버튼 (경성맥주 스타일) #}
<div class="inq-bar">
  <div class="inq-in">
    <div class="inq-logo">
      {% if brand.logo %}
      <img src="{{ brand.logo }}" alt="{{ brand.name }}">
      {% else %}
      <span class="lg1 disp">{{ brand.name }}</span>
      {% endif %}
    </div>
    <a class="inq-call" href="tel:{{ brand.phone | replace('-', '') }}">
      <span class="lbl">가맹문의</span>
      <span class="num disp">{{ brand.phone }}</span>
    </a>
    <div class="inq-btns">
      <a class="inq-btn kakao" {% if brand.kakao_url %}href="{{ brand.kakao_url }}" target="_blank" rel="noopener"{% else %}href="tel:{{ brand.phone | replace('-', '') }}"{% endif %}>
        <b>💬 카카오톡 상담</b><span>{% if brand.kakao_url %}채널로 바로 연결{% else %}채널 오픈 준비중 · 전화 연결{% endif %}</span>
      </a>
      <a class="inq-btn taste" href="{{ url_for('inquiry.form', type='taste') }}">
        <b>🍗 무료시식 신청</b><span>본사 방문 시식 상담</span>
      </a>
    </div>
  </div>
</div>
